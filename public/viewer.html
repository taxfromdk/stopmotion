<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>flic</title>
<style>
  :root {
    --bg: #16191f;
    --panel: #20242d;
    --panel-2: #2a303c;
    --text: #e8ebf0;
    --muted: #9aa3b2;
    --accent: #5b8cff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 16px; border-bottom: 1px solid #2e3440;
  }
  header .title { font-size: 15px; letter-spacing: .3px; }
  header .title .code { color: var(--muted); font-size: 13px; margin-left: 8px; }
  main { flex: 1; min-height: 0; display: flex; }
  #stage {
    position: relative; flex: 1; min-width: 0; min-height: 220px;
    background: #000; display: flex; align-items: center; justify-content: center;
  }
  #playback { max-width: 100%; max-height: 100%; object-fit: contain; }
  #bigplay {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 74px; height: 74px; border-radius: 50%; padding: 0;
    background: rgba(91, 140, 255, .92); border: 4px solid rgba(255,255,255,.25);
    font-size: 30px; line-height: 1; cursor: pointer; z-index: 3;
    display: flex; align-items: center; justify-content: center;
  }
  #bigplay:hover { background: #6f9aff; }
  #bigplay[hidden] { display: none; }
  #msg {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 24px; text-align: center; color: var(--muted); font-size: 15px; line-height: 1.6;
  }
  #msg[hidden] { display: none; }
  #bar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 14px; background: var(--panel); border-top: 1px solid #2e3440;
  }
  button, a.fork {
    font: inherit; font-size: 14px; color: var(--text);
    background: var(--panel-2); border: 1px solid #394152;
    border-radius: 10px; padding: 8px 14px; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  a.fork { background: #2e7d5b; border-color: #3d9970; font-weight: 600; }
  a.fork:hover { background: #379268; }
  #counter { color: var(--muted); font-size: 13.5px; font-variant-numeric: tabular-nums; min-width: 64px; text-align: center; }
  #fps-tag { color: var(--muted); font-size: 13px; }
  .spacer { flex: 1; }
  footer {
    padding: 6px 14px; text-align: center; color: var(--muted); font-size: 12px;
    background: var(--panel); border-top: 1px solid #2e3440;
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer #origin { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; word-break: break-word; }
  footer #origin[hidden] { display: none; }
</style>
</head>
<body>
<header>
  <span class="title">&#127916; flic<span class="code" id="code-label"></span></span>
</header>
<main>
  <div id="stage">
    <canvas id="playback" hidden></canvas>
    <button id="bigplay" hidden title="Play">&#9654;</button>
    <div id="msg" hidden>Loading&#8230;</div>
  </div>
</main>
<div id="bar">
  <button id="play-btn" disabled>&#9654; Play</button>
  <span id="counter"></span>
  <span id="fps-tag"></span>
  <span class="spacer"></span>
  <a class="fork" id="fork-btn" href="#" title="Load this work into the studio and make your own version">&#127912; Make my own copy</a>
</div>
<footer>Made with &#127916; <a href="/">flic.dk</a><span id="origin" hidden></span></footer>
<script src="zip-codec.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const canvas = $('#playback'), msg = $('#msg'), bigplay = $('#bigplay');
const playBtn = $('#play-btn'), counter = $('#counter'), fpsTag = $('#fps-tag'), originEl = $('#origin');
/* Code comes from the path (/{code}) or ?c= (local dev redirect);
   codes are 5 letters, case-insensitive. ?mute=1 plays silently so the
   page can autoplay inside the admin preview iframe. */
const params = new URLSearchParams(location.search);
const code = String(params.get('c') || decodeURIComponent(location.pathname.slice(1))).toLowerCase();
const muted = params.get('mute') === '1';

$('#code-label').textContent = code ? '· ' + code : '';
$('#fork-btn').href = '/?fork=' + encodeURIComponent(code);

function showMsg(text) {
  msg.textContent = text;
  msg.hidden = false;
}
function b64(bytes) {
  let bin = '';
  const CH = 0x8000;
  for (let i = 0; i < bytes.length; i += CH) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + CH, bytes.length)));
  }
  return btoa(bin);
}

let frames = [], settings = { fps: 8, loop: true };
let playing = false, playIndex = 0, loadedImgs = [];
let rafId = null, lastT = 0, acc = 0, soundHold = null;
const hasSounds = () => frames.some(f => f.sound);
/* Title cards (silent-film "sign" frames): black background, centered text. */
const TITLE_MAX_LINES = 3;
const TITLE_MAX_CHARS = 30; // per line
function isTitleCard(f) { return !!(f && f.type === 'title'); }
function titleLines(f) {
  const raw = (f.title || '').split('\n').slice(0, TITLE_MAX_LINES);
  while (raw.length < TITLE_MAX_LINES) raw.push('');
  return raw.map(s => String(s).slice(0, TITLE_MAX_CHARS));
}
function drawTitleCard(ctx, W, H, f) {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  const lines = titleLines(f);
  const fontPx = Math.max(11, Math.min(W / 12, H / 6));
  const serif = 'Georgia, "Times New Roman", "Garamond", serif';
  const nonEmpty = lines.filter(l => l.trim()).length;
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (!nonEmpty) {
    ctx.font = 'italic ' + fontPx + 'px ' + serif;
    ctx.globalAlpha = 0.5;
    ctx.fillText('\u2014 \u2014', W / 2, H / 2);
    ctx.globalAlpha = 1;
    return;
  }
  const lineH = fontPx * 1.25;
  const startY = H / 2 - ((nonEmpty - 1) * lineH) / 2;
  ctx.font = fontPx + 'px ' + serif;
  lines.forEach((line, i) => {
    if (!line.trim()) return;
    ctx.fillText(line, W / 2, startY + i * lineH);
  });
}

function drawFrame(i) {
  const f = frames[i];
  const ctx = canvas.getContext('2d');
  if (isTitleCard(f)) {
    const W = 960, H = 540;
    if (canvas.width !== W) canvas.width = W;
    if (canvas.height !== H) canvas.height = H;
    drawTitleCard(ctx, W, H, f);
  } else {
    const img = loadedImgs[i];
    if (!img) return;
    if (canvas.width !== img.naturalWidth || canvas.height !== img.naturalHeight) {
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
    }
    ctx.drawImage(img, 0, 0);
  }
  counter.textContent = (i + 1) + ' / ' + frames.length;
}
function setPlayButtons() {
  playBtn.innerHTML = playing ? '&#9208; Pause' : '&#9654; Play';
  playBtn.disabled = !frames.length;
  bigplay.hidden = playing || !frames.length;
  bigplay.title = playing ? 'Pause' : 'Play';
  bigplay.innerHTML = playing ? '&#9208;' : '&#9654;';
}
function stopAllSounds() {
  if (soundHold) { soundHold.pause(); soundHold = null; }
}
function playFrameSound(i) {
  const f = frames[i];
  if (!f || !f.sound) return;
  const el = new Audio(f.sound);
  if (muted) el.muted = true;
  if (f.hold && playing) {
    soundHold = el;
    const release = () => {
      if (soundHold === el) {
        soundHold = null;
        lastT = performance.now(); acc = 0;
      }
      el.removeEventListener('ended', release);
      el.removeEventListener('error', release);
    };
    el.addEventListener('ended', release);
    el.addEventListener('error', release);
  }
  const p = el.play();
  if (p && p.catch) p.catch(() => {});
}
function tick(now) {
  if (!playing) return;
  rafId = requestAnimationFrame(tick);
  if (soundHold && !soundHold.ended) return;   // hold this frame until its sound finishes
  acc += now - lastT; lastT = now;
  const stepMs = 1000 / settings.fps;
  const prevIdx = playIndex;
  while (acc >= stepMs) {
    acc -= stepMs;
    if (playIndex < frames.length - 1) playIndex++;
    else if (!settings.loop) { pause(); return; }
    else playIndex = 0;
  }
  drawFrame(playIndex);
  if (playIndex !== prevIdx) playFrameSound(playIndex);
}
function play() {
  if (!frames.length || playing) return;
  playing = true;
  stopAllSounds();
  if (playIndex >= frames.length) playIndex = 0;
  lastT = performance.now(); acc = 0;
  playFrameSound(playIndex);
  setPlayButtons();
  rafId = requestAnimationFrame(tick);
}
function pause() {
  playing = false;
  if (rafId) cancelAnimationFrame(rafId);
  rafId = null;
  stopAllSounds();
  setPlayButtons();
}
function toggle() { playing ? pause() : play(); }

playBtn.addEventListener('click', toggle);
bigplay.addEventListener('click', toggle);

/* ---------- load the shared work ---------- */
(async () => {
  if (!code) { showMsg('Missing code in the link.'); return; }
  try {
    const res = await fetch('/api/project/' + encodeURIComponent(code));
    if (!res.ok) {
      let detail = 'The link may be mistyped, or the work may have been deleted.';
      try { const d = await res.json(); if (d && d.error) detail = d.error; } catch (e) { /* keep default */ }
      showMsg('\u{1F43B} ' + detail);
      return;
    }
    // Show where the work was made from (sent by the worker as X-Work-* headers).
    const workOrigin = res.headers.get('x-work-origin') || '';
    const workIp = res.headers.get('x-work-ip') || '';
    const workUa = res.headers.get('x-work-ua') || '';
    if (workOrigin || workIp) {
      const parts = [];
      if (workOrigin) {
        try { parts.push(new URL(workOrigin).host); } catch (e) { parts.push(workOrigin); }
      }
      if (workIp) parts.push(workIp);
      originEl.textContent = 'Made from ' + parts.join(' · ') + (workUa ? ' · ' + workUa : '');
      originEl.title = (workUa ? workUa : '') + (workOrigin ? '\n' + workOrigin : '');
      originEl.hidden = false;
    }
    const files = ZipCodec.readZip(new Uint8Array(await res.arrayBuffer()));
    if (!files['project.json']) throw new Error('No project.json in the archive.');
    const project = JSON.parse(new TextDecoder().decode(files['project.json']));
    if (project.format !== 'stopmotion-project' || !Array.isArray(project.frames)) throw new Error('Unrecognized project file.');
    frames = project.frames.map(ref => {
      let f;
      if (ref && ref.type === 'title') {
        // Title card: text travels in project.json, no image file.
        const lines = Array.isArray(ref.title) ? ref.title : String(ref.title || '').split('\n');
        f = { type: 'title', title: lines.slice(0, TITLE_MAX_LINES).map(s => String(s).slice(0, TITLE_MAX_CHARS)).join('\n') };
      } else {
        if (!ref || typeof ref.image !== 'string' || !files[ref.image]) throw new Error('Missing image "' + ((ref && ref.image) || '?') + '".');
        f = { url: 'data:' + (ref.mime || 'image/jpeg') + ';base64,' + b64(files[ref.image]) };
      }
      if (ref.sound) {
        if (!files[ref.sound.path]) throw new Error('Missing sound "' + ref.sound.path + '".');
        f.sound = 'data:' + (ref.sound.mime || 'audio/webm') + ';base64,' + b64(files[ref.sound.path]);
      }
      if (ref.hold) f.hold = true;
      return f;
    });
    if (!frames.length) { showMsg('This work has no frames yet.'); return; }
    if (project.settings && typeof project.settings === 'object') {
      settings.fps = Math.min(24, Math.max(1, +project.settings.fps || 8));
      settings.loop = project.settings.loop !== false;
    }
    fpsTag.textContent = settings.fps + ' fps' + (settings.loop ? ' · loops' : '');
    loadedImgs = await Promise.all(frames.map(f => {
      if (isTitleCard(f)) return null;      // title cards have no image to load
      return new Promise((res2, rej) => {
        const im = new Image();
        im.onload = () => res2(im);
        im.onerror = () => rej(new Error('frame load failed'));
        im.src = f.url;
      });
    }));
    msg.hidden = true;
    canvas.hidden = false;
    drawFrame(0);
    setPlayButtons();
    // Silent works and muted previews can autoplay; others start paused.
    if (muted || !hasSounds()) play();
  } catch (err) {
    console.error(err);
    showMsg('Could not load this work: ' + err.message);
  }
})();
})();
</script>
</body>
</html>
