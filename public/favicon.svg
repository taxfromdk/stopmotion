<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Film clapperboard favicon for flic.dk -->
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a303c"/>
      <stop offset="1" stop-color="#1a1e26"/>
    </linearGradient>
  </defs>
  <!-- background rounded square -->
  <rect width="64" height="64" rx="12" fill="#16191f"/>
  <!-- clapper top (the hinged, striped part) -->
  <g transform="rotate(-8 32 20)">
    <rect x="8" y="14" width="48" height="12" rx="2" fill="#e8ebf0"/>
    <!-- diagonal stripes on the clapper -->
    <path d="M12 14 l6 12 M20 14 l6 12 M28 14 l6 12 M36 14 l6 12 M44 14 l6 12 M52 14 l6 12"
          stroke="#16191f" stroke-width="4" stroke-linecap="round"/>
    <rect x="8" y="14" width="48" height="12" rx="2" fill="none" stroke="#16191f" stroke-width="2"/>
  </g>
  <!-- hinge dot -->
  <circle cx="14" cy="26" r="2.5" fill="#5b8cff"/>
  <!-- board body -->
  <rect x="8" y="28" width="48" height="28" rx="3" fill="url(#board)" stroke="#394152" stroke-width="2"/>
  <!-- film sprocket holes (two rows) -->
  <g fill="#0c0e12">
    <circle cx="14" cy="34" r="1.8"/><circle cx="20" cy="34" r="1.8"/><circle cx="26" cy="34" r="1.8"/>
    <circle cx="32" cy="34" r="1.8"/><circle cx="38" cy="34" r="1.8"/><circle cx="44" cy="34" r="1.8"/><circle cx="50" cy="34" r="1.8"/>
    <circle cx="14" cy="50" r="1.8"/><circle cx="20" cy="50" r="1.8"/><circle cx="26" cy="50" r="1.8"/>
    <circle cx="32" cy="50" r="1.8"/><circle cx="38" cy="50" r="1.8"/><circle cx="44" cy="50" r="1.8"/><circle cx="50" cy="50" r="1.8"/>
  </g>
  <!-- a small play triangle in the board center (the "film" screen) -->
  <path d="M29 40 L40 46 L29 52 Z" fill="#5b8cff"/>
</svg>
