<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>Stop Motion Studio</title>
<style>
  :root {
    --bg: #16191f;
    --panel: #20242d;
    --panel-2: #2a303c;
    --text: #e8ebf0;
    --muted: #9aa3b2;
    --accent: #5b8cff;
    --danger: #ff5c5c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; border-bottom: 1px solid #2e3440;
  }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .3px; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  main { flex: 1; display: flex; flex-direction: column; min-height: 0; }

  /* ---- stage (full-bleed) ---- */
  #stage-panel { flex: 1; min-width: 0; min-height: 0; display: flex; }
  #stage {
    position: relative;
    width: 100%; flex: 1; min-height: 260px;
    background: #000; overflow: hidden;
  }
  #stage video, #ghost, #playback {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
  }
  #playback { z-index: 1; }
  #ghost { opacity: .5; pointer-events: none; display: none; z-index: 2; }
  #playback { display: none; background: #000; }
  #stage[data-mode="play"] video, #stage[data-mode="play"] #ghost { visibility: hidden; }
  #stage[data-mode="play"] #playback { display: block; }
  #flash {
    position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 5;
  }
  #ctrl-box {
    position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 4;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    max-width: calc(100% - 24px); padding: 8px 14px;
    background: rgba(8, 10, 14, .6); border: 1px solid rgba(255,255,255,.09); border-radius: 14px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  #ctrl-box .group { background: transparent; padding: 0; }
  #flash.on { animation: flash .25s ease-out; }
  @keyframes flash { from { opacity: .8; } to { opacity: 0; } }

  /* ---- controls ---- */
  .controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: center; max-width: 900px; }
  .group { display: flex; align-items: center; gap: 8px; background: var(--panel); padding: 6px 10px; border-radius: 10px; }
  button {
    font: inherit; color: var(--text); background: var(--panel-2);
    border: 1px solid #394152; border-radius: 8px; padding: 7px 12px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #capture-btn { background: #c0392b; border-color: #e74c3c; font-weight: 600; padding: 8px 18px; }
  #capture-btn:hover:not(:disabled) { background: #d64535; }
  label.ghost-label { display: flex; align-items: center; gap: 7px; cursor: pointer; user-select: none; font-size: 14px; color: var(--muted); }
  input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }
  input[type="range"] { accent-color: var(--accent); width: 110px; }
  .fps-val { min-width: 42px; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
  #status { min-height: 20px; font-size: 13.5px; color: var(--muted); text-align: center; max-width: 860px; }
  #status.error { color: var(--danger); }

  /* ---- reel (bottom strip) ---- */
  #frames-panel {
    width: 100%; flex-shrink: 0; background: var(--panel);
    border-top: 1px solid #2e3440; display: flex; flex-direction: column; min-height: 0; max-height: 250px;
  }
  .panel-head { padding: 12px 14px 8px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .panel-head h2 { margin: 0; font-size: 15px; }
  #frame-meta { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #frame-list {
    list-style: none; margin: 0; padding: 8px 12px; flex: 1; overflow-x: auto; overflow-y: hidden;
    display: flex; flex-direction: row; align-items: center; gap: 8px; user-select: none; min-height: 60px;
  }
  #frame-list li {
    position: relative; margin: 0; width: 132px; flex-shrink: 0; border-radius: 8px;
    outline: 2px solid transparent; transition: outline-color .1s;
  }
  #frame-list li img { width: 100%; display: block; border-radius: 8px; pointer-events: none; }
  #frame-list li.dragging { opacity: .45; outline-color: var(--accent); }
  #frame-list li.selected { outline-color: var(--accent); }
  .idx {
    position: absolute; top: 6px; left: 6px; z-index: 1;
    background: rgba(0,0,0,.72); border-radius: 6px; padding: 1px 8px; font-size: 12px;
  }
  .del {
    position: absolute; top: 5px; right: 5px; z-index: 1;
    width: 24px; height: 24px; padding: 0; line-height: 1; border-radius: 6px;
    background: rgba(0,0,0,.72); color: #ffb3b3; font-size: 15px;
  }
  .del:hover { background: var(--danger); color: #fff; border-color: transparent; }
  .snd-bar { position: absolute; left: 4px; right: 4px; bottom: 4px; z-index: 1; display: flex; gap: 3px; justify-content: flex-end; }
  .snd-bar button { padding: 0 6px; font-size: 11.5px; line-height: 18px; border-radius: 5px; background: rgba(0,0,0,.72); border-color: transparent; }
  .snd-bar button.on { background: var(--accent); color: #fff; }
  li.recording { animation: recpulse 1s ease-in-out infinite; }
  @keyframes recpulse { 0%, 100% { outline-color: rgba(255,92,92,.35); } 50% { outline-color: #ff5c5c; } }
  .empty-hint { color: var(--muted); font-size: 13px; text-align: center; margin-top: 24px; padding: 0 8px; line-height: 1.5; }
  .panel-foot { padding: 8px 14px 12px; border-top: 1px solid #2e3440; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .hint { color: var(--muted); font-size: 11.5px; line-height: 1.45; margin: 0; }
  #clear-btn { color: #ffb3b3; border-color: #5a2b2b; padding: 5px 10px; font-size: 12.5px; }
  #clear-btn:hover:not(:disabled) { background: var(--danger); color: #fff; border-color: transparent; }
</style>
</head>
<body>
<input type="file" id="project-file" accept=".zip,application/zip,application/x-zip-compressed" hidden />
<header>
  <h1>&#127916; Stop Motion Studio</h1>
  <div class="header-right">
    <span id="storage-info" style="color:var(--muted);font-size:13px;"></span>
    <button id="save-project-btn" title="Download the whole project (structure + images + sounds) as a .zip file">&#128190; Save project</button>
    <button id="load-project-btn" title="Open a previously saved .zip project file">&#128194; Load project&#8230;</button>
  </div>
</header>
<main>
  <section id="stage-panel">
    <div id="stage" data-mode="camera">
      <video id="camera" autoplay playsinline muted></video>
      <img id="ghost" alt="" draggable="false" />
      <canvas id="playback"></canvas>
      <div id="flash"></div>
      <div id="ctrl-box">
        <div class="controls">
          <button id="capture-btn">&#128247; Capture frame</button>
          <button id="retry-cam" title="Request camera access again">&#128247; Retry camera</button>
          <label class="ghost-label" title="Overlay the last captured frame at 50% opacity so you can align objects between shots">
            <input type="checkbox" id="ghost-toggle" /> Ghost previous (50%)
          </label>
        </div>
        <div class="controls">
          <div class="group">
            <button id="play-btn">&#9654; Play</button>
            <button id="step-back" title="Previous frame">&#9198;</button>
            <button id="step-fwd" title="Next frame">&#9197;</button>
            <button id="cam-btn" title="Back to live camera view">&#128247; Live</button>
          </div>
          <div class="group">
            <span style="font-size:13px;color:var(--muted);">FPS</span>
            <input type="range" id="fps" min="1" max="24" step="1" />
            <span class="fps-val" id="fps-val"></span>
          </div>
          <label class="ghost-label" title="When on, playback wraps back to the first frame; when off, it stops after the last frame">
            <input type="checkbox" id="loop-toggle" checked /> Loop
          </label>
        </div>
        <div id="status"></div>
      </div>
    </div>
  </section>

  <aside id="frames-panel">
    <div class="panel-head">
      <h2>Frames (<span id="frame-count">0</span>)</h2>
      <span id="frame-meta"></span>
    </div>
    <ol id="frame-list"></ol>
    <div class="panel-foot">
      <p class="hint">Click a frame to show it · new captures land right after the selected one (blue outline) · drag to reorder · 🎙 records sound on that frame · toggle "Hold" on a frame to keep it up until its sound ends.</p>
      <button id="clear-btn" title="Delete all frames">Clear</button>
    </div>
  </aside>
</main>
<script id="zip-codec">
/* Minimal ZIP archive codec — store method only, zero dependencies.
   Runs entirely in the browser; images/sounds are already compressed
   formats so no deflate is needed. The reader accepts stored entries from
   any tool and reports a clear error on compressed ones. */
(function (g) {
'use strict';

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n >>> 0;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function dosDateTime(d) {
  d = d || new Date();
  const year = Math.max(1980, d.getFullYear());
  return {
    time: (d.getHours() << 11) | (d.getMinutes() << 5) | Math.floor(d.getSeconds() / 2),
    date: (((year - 1980) & 0x7F) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()
  };
}

function concat(parts) {
  let total = 0;
  for (const p of parts) total += p.length;
  const out = new Uint8Array(total);
  let o = 0;
  for (const p of parts) { out.set(p, o); o += p.length; }
  return out;
}

/* entries: [{name: string, data: Uint8Array}] -> Uint8Array zip */
function writeZip(entries) {
  const enc = new TextEncoder();
  const ts = dosDateTime();
  const parts = [];
  const central = [];
  let offset = 0;
  for (const e of entries) {
    if (!(e.data instanceof Uint8Array)) throw new Error('entry "' + e.name + '": data must be a Uint8Array');
    const nameBytes = enc.encode(e.name);
    const crc = crc32(e.data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true);   // local file header signature
    lh.setUint16(4, 20, true);           // version needed to extract
    lh.setUint16(8, 0, true);            // compression: store
    lh.setUint16(10, ts.time, true);
    lh.setUint16(12, ts.date, true);
    lh.setUint32(14, crc, true);
    lh.setUint32(18, e.data.length, true);
    lh.setUint32(22, e.data.length, true);
    lh.setUint16(26, nameBytes.length, true);
    parts.push(new Uint8Array(lh.buffer), nameBytes, e.data);
    central.push({ nameBytes: nameBytes, crc: crc, size: e.data.length, offset: offset });
    offset += 30 + nameBytes.length + e.data.length;
  }
  const cdStart = offset;
  for (const c of central) {
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true);   // central directory signature
    ch.setUint16(4, 20, true);           // version made by
    ch.setUint16(6, 20, true);           // version needed to extract
    ch.setUint16(8, 0, true);            // flags
    ch.setUint16(10, 0, true);           // compression: store
    ch.setUint16(12, ts.time, true);
    ch.setUint16(14, ts.date, true);
    ch.setUint32(16, c.crc, true);
    ch.setUint32(20, c.size, true);      // compressed size (== stored)
    ch.setUint32(24, c.size, true);      // uncompressed size
    ch.setUint16(28, c.nameBytes.length, true);
    ch.setUint16(34, 0, true);           // disk number start
    ch.setUint32(38, 0, true);           // external attributes
    ch.setUint32(42, c.offset, true);    // local header offset
    parts.push(new Uint8Array(ch.buffer), c.nameBytes);
    offset += 46 + c.nameBytes.length;
  }
  const cdSize = offset - cdStart;
  const eocd = new DataView(new ArrayBuffer(22));
  eocd.setUint32(0, 0x06054b50, true);   // end of central directory signature
  eocd.setUint16(8, central.length, true);
  eocd.setUint16(10, central.length, true);
  eocd.setUint32(12, cdSize, true);
  eocd.setUint32(16, cdStart, true);
  parts.push(new Uint8Array(eocd.buffer));
  return concat(parts);
}

/* ArrayBuffer | Uint8Array -> { [name]: Uint8Array } */
function readZip(buf) {
  const bytes = (buf instanceof Uint8Array) ? buf : new Uint8Array(buf);
  if (bytes.length < 22) throw new Error('Not a ZIP file (too small).');
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  let eocd = -1;
  const minPos = Math.max(0, bytes.length - 22 - 65535); // allow up to a 64k comment
  for (let i = bytes.length - 22; i >= minPos; i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('Not a ZIP file (end-of-directory record not found).');
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const files = {};
  for (let n = 0; n < count; n++) {
    if (dv.getUint32(p, true) !== 0x02014b50) throw new Error('Corrupt ZIP: bad central directory entry.');
    const method = dv.getUint16(p + 10, true);
    const uncompSize = dv.getUint32(p + 24, true);
    const nameLen = dv.getUint16(p + 28, true);
    const extraLen = dv.getUint16(p + 30, true);
    const commentLen = dv.getUint16(p + 32, true);
    const localOffset = dv.getUint32(p + 42, true);
    const name = new TextDecoder().decode(bytes.subarray(p + 46, p + 46 + nameLen));
    if (method !== 0) throw new Error('Entry "' + name + '" is compressed; only stored (uncompressed) ZIP entries are supported.');
    if (dv.getUint32(localOffset, true) !== 0x04034b50) throw new Error('Corrupt ZIP: bad local header for "' + name + '".');
    const lNameLen = dv.getUint16(localOffset + 26, true);
    const lExtraLen = dv.getUint16(localOffset + 28, true);
    const dataStart = localOffset + 30 + lNameLen + lExtraLen;
    if (dataStart + uncompSize > bytes.length) throw new Error('Corrupt ZIP: truncated entry "' + name + '".');
    files[name] = bytes.slice(dataStart, dataStart + uncompSize);
    p += 46 + nameLen + extraLen + commentLen;
  }
  return files;
}

g.ZipCodec = { writeZip: writeZip, readZip: readZip };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const KEY_FRAMES = 'stopmotion.frames.v1';
const KEY_SETTINGS = 'stopmotion.settings.v1';

let frames = [];            // [{id, url}] in playback order
let settings = { fps: 8, ghost: true, loop: true };
let stream = null;
let playing = false;
let playIndex = 0;
let loadedImgs = [];        // HTMLImageElement[] aligned with frames
let rafId = null, lastT = 0, acc = 0;
let dragId = null;
let recording = null;          // {frameId, rec, auto} while a frame sound is being recorded
const activeAudios = [];       // spawned players currently sounding (overlaps allowed)
let soundHold = null;          // audio element holding playback in "hold for sounds" mode
let cursorId = null;           // selected frame id — new captures insert right after it

const stage = $('#stage'), video = $('#camera'), ghostImg = $('#ghost'), canvas = $('#playback');
const list = $('#frame-list'), statusEl = $('#status');
const captureBtn = $('#capture-btn'), playBtn = $('#play-btn');
const fpsSlider = $('#fps'), fpsVal = $('#fps-val'), ghostToggle = $('#ghost-toggle');
const loopToggle = $('#loop-toggle');

/* ---------- helpers ---------- */
function uid() {
  return (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
}
function formatBytes(n) {
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1048576).toFixed(2) + ' MB';
}
function setStatus(msg, isError = false) {
  statusEl.textContent = msg;
  statusEl.classList.toggle('error', !!isError);
}

/* ---------- persistence (localStorage) ---------- */
function persist() {
  try {
    localStorage.setItem(KEY_FRAMES, JSON.stringify(frames));
    localStorage.setItem(KEY_SETTINGS, JSON.stringify(settings));
    updateStorageInfo();
    return true;
  } catch (e) {
    setStatus('Could not save to local storage (quota exceeded?). Delete some frames or use a lower resolution.', true);
    return false;
  }
}
function loadState() {
  try {
    const f = JSON.parse(localStorage.getItem(KEY_FRAMES));
    if (Array.isArray(f)) frames = f.filter(x => x && typeof x.url === 'string');
    const s = JSON.parse(localStorage.getItem(KEY_SETTINGS));
    if (s) settings = Object.assign(settings, s);
  } catch (e) { /* first run */ }
}
function updateStorageInfo() {
  try {
    $('#storage-info').textContent = formatBytes(new Blob([localStorage.getItem(KEY_FRAMES) || '']).size) + ' in local storage';
    const bytes = new Blob([JSON.stringify(frames)]).size;
    $('#frame-meta').textContent = frames.length ? formatBytes(bytes) : '';
  } catch (e) { /* ignore */ }
}

/* ---------- camera ---------- */
async function startCamera() {
  if (!window.isSecureContext) {
    captureBtn.disabled = true;
    setStatus('Camera blocked: this page is not in a secure context. Open it via http://localhost:8000 (not another IP or hostname), or serve over HTTPS.', true);
    return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    captureBtn.disabled = true;
    setStatus('Camera blocked: this browser does not expose getUserMedia. Try Chrome, Edge, or Firefox with camera support enabled.', true);
    return;
  }
  try {
    const oldStream = stream;
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    if (oldStream) oldStream.getTracks().forEach(t => t.stop());
    video.srcObject = stream;
    captureBtn.disabled = false;
    setStatus('Camera ready. Press Capture to add a frame — the ghost overlay helps you align objects.');
  } catch (err) {
    captureBtn.disabled = true;
    let msg = 'Camera unavailable (' + err.name + ').';
    if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
      msg = 'Camera permission was denied. Click the camera icon in the address bar, allow access for this site, then press "Retry camera".';
    } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
      msg = 'No camera device was found on this machine.';
    } else if (err.name === 'NotReadableError') {
      msg = 'The camera is in use by another application. Close it, then press "Retry camera".';
    }
    setStatus(msg, true);
  }
}

/* ---------- capture ---------- */
function flash() {
  const f = $('#flash');
  f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
}
function showGhost(url) {
  if (settings.ghost && url) {
    if (ghostImg.src !== url) ghostImg.src = url;
    ghostImg.style.display = 'block';
  } else {
    ghostImg.style.display = 'none';
  }
}
function updateGhost() {           // camera mode: the frame before the next shot = last in reel
  showGhost(frames.length ? frames[frames.length - 1].url : null);
}
function capture() {
  if (!video.videoWidth || !video.videoHeight) return;
  const maxEdge = 1280;
  let w = video.videoWidth, h = video.videoHeight;
  const s = Math.min(1, maxEdge / Math.max(w, h));
  w = Math.round(w * s); h = Math.round(h * s);
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.getContext('2d').drawImage(video, 0, 0, w, h);
  const f = { id: uid(), url: c.toDataURL('image/jpeg', 0.75) };
  const ci = cursorId ? frames.findIndex(x => x.id === cursorId) : -1;
  if (ci >= 0) frames.splice(ci + 1, 0, f); else frames.push(f);
  cursorId = f.id;
  persist(); renderFrames(); flash();
  stage.dataset.mode = 'camera'; updateGhost();
}

/* ---------- frame list rendering + drag reorder ---------- */
function renderFrames() {
  list.innerHTML = '';
  if (!frames.length) {
    const li = document.createElement('li');
    li.className = 'empty-hint';
    li.textContent = 'No frames yet. Capture your first shot!';
    li.style.outline = 'none';
    list.appendChild(li);
  } else {
    frames.forEach((f, i) => {
      const li = document.createElement('li');
      li.draggable = true;
      li.dataset.id = f.id;
      const idx = document.createElement('span');
      idx.className = 'idx'; idx.textContent = i + 1;
      const img = document.createElement('img');
      img.src = f.url; img.alt = 'Frame ' + (i + 1); img.draggable = false;
      const del = document.createElement('button');
      del.className = 'del'; del.title = 'Delete frame'; del.textContent = '\u00d7';
      const bar = document.createElement('div');
      bar.className = 'snd-bar';
      if (recording && recording.frameId === f.id) {
        li.classList.add('recording');
        bar.appendChild(makeSndBtn('stop-rec', '\u25a0 Stop'));
      } else {
        if (f.sound) bar.appendChild(makeSndBtn('preview', '\u25b6', 'Preview sound'));
        if (f.sound) {
          const hb = makeSndBtn('hold', 'Hold', f.hold ? 'On: this frame stays on screen until its sound ends' : 'Keep this frame on screen until its sound ends');
          if (f.hold) hb.classList.add('on');
          bar.appendChild(hb);
        }
        bar.appendChild(makeSndBtn('rec', '\ud83c\udfa7', f.sound ? 'Re-record sound (replaces current)' : 'Record a sound for this frame'));
        if (f.sound) bar.appendChild(makeSndBtn('rm-snd', '\u2715\u266a', 'Remove sound'));
      }
      li.append(idx, img, del, bar);
      list.appendChild(li);
    });
  }
  $('#frame-count').textContent = frames.length;
  markSelected();
  updateStorageInfo();
}

/* ---------- frame selection / show on stage ---------- */
function markSelected() {
  for (const li of list.querySelectorAll('li[data-id]')) {
    li.classList.toggle('selected', li.dataset.id === cursorId);
  }
}
async function selectFrame(id) {
  const i = frames.findIndex(f => f.id === id);
  if (i < 0) return;
  cursorId = id;
  markSelected();
  playing = false;
  if (rafId) cancelAnimationFrame(rafId);
  stopAllSounds();
  try { await ensureLoaded(); } catch (err) { return; }
  playIndex = i;
  stage.dataset.mode = 'play';
  showGhost(null);
  drawFrame(i);
}
function backToCamera() {
  playing = false;
  if (rafId) cancelAnimationFrame(rafId);
  stopAllSounds();
  stage.dataset.mode = 'camera';
  setPlayButtons(); updateGhost();
}

list.addEventListener('click', e => {
  const actBtn = e.target.closest('button[data-act]');
  if (actBtn) {
    const li = actBtn.closest('li[data-id]');
    if (!li) return;
    const id = li.dataset.id;
    const act = actBtn.dataset.act;
    if (act === 'rec') startRecording(id);
    else if (act === 'stop-rec') stopRecording();
    else if (act === 'preview') previewSound(id);
    else if (act === 'rm-snd') removeSound(id);
    else if (act === 'hold') toggleHold(id);
    return;
  }
  const del = e.target.closest('.del');
  if (del) {
    const li2 = del.closest('li[data-id]');
    if (!li2) return;
    if (recording && recording.frameId === li2.dataset.id) stopRecording();
    frames = frames.filter(f => f.id !== li2.dataset.id);
    persist(); renderFrames(); updateGhost();
    return;
  }
  const selLi = e.target.closest('li[data-id]');
  if (selLi) selectFrame(selLi.dataset.id);
});

list.addEventListener('dragstart', e => {
  const li = e.target.closest && e.target.closest('li[data-id]');
  if (!li) return;
  dragId = li.dataset.id;
  li.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', dragId); } catch (err) { /* ignore */ }
});

list.addEventListener('dragover', e => {
  if (!dragId) return;
  e.preventDefault();
  const dragging = list.querySelector('.dragging');
  if (!dragging) return;
  let best = { offset: -Infinity, el: null };
  for (const li of list.querySelectorAll('li[data-id]:not(.dragging)')) {
    const box = li.getBoundingClientRect();
    const off = e.clientX - box.left - box.width / 2;
    if (off < 0 && off > best.offset) best = { offset: off, el: li };
  }
  if (best.el) list.insertBefore(dragging, best.el); else list.appendChild(dragging);
});

list.addEventListener('drop', e => e.preventDefault());

list.addEventListener('dragend', () => {
  const dragging = list.querySelector('.dragging');
  if (dragging) dragging.classList.remove('dragging');
  if (!dragId) return;
  dragId = null;
  const ids = [...list.querySelectorAll('li[data-id]')].map(li => li.dataset.id);
  frames.sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id));
  persist(); renderFrames(); updateGhost();
});

/* ---------- settings controls ---------- */
ghostToggle.addEventListener('change', () => {
  settings.ghost = ghostToggle.checked;
  persist(); updateGhost();
});
fpsSlider.addEventListener('input', () => {
  settings.fps = +fpsSlider.value;
  fpsVal.textContent = settings.fps;
  persist();
});
loopToggle.addEventListener('change', () => {
  settings.loop = loopToggle.checked;
  persist();
});

$('#clear-btn').addEventListener('click', () => {
  if (!frames.length) return;
  if (confirm('Delete all ' + frames.length + ' frames? This cannot be undone.')) {
    frames = [];
    persist(); renderFrames(); updateGhost();
    setStatus('All frames deleted.');
  }
});

captureBtn.addEventListener('click', capture);
$('#retry-cam').addEventListener('click', startCamera);

/* ---------- init ---------- */
loadState();
fpsSlider.value = settings.fps;
fpsVal.textContent = settings.fps;
ghostToggle.checked = settings.ghost;
loopToggle.checked = settings.loop !== false;
renderFrames(); updateGhost(); startCamera();

/* ---------- per-frame sound ---------- */
function makeSndBtn(act, text, title) {
  const b = document.createElement('button');
  b.dataset.act = act;
  b.textContent = text;
  if (title) b.title = title;
  return b;
}
function spawnSound(src) {
  const el = new Audio(src);   // fresh player per trigger — same frame may overlap itself
  activeAudios.push(el);
  el.addEventListener('ended', () => {
    const i = activeAudios.indexOf(el);
    if (i !== -1) activeAudios.splice(i, 1);
  });
  const p = el.play();
  if (p && p.catch) p.catch(() => {});
  return el;
}
function stopAllSounds() {
  clearSoundHold();
  while (activeAudios.length) activeAudios.pop().pause();
}
function clearSoundHold() {
  if (!soundHold) return;
  soundHold = null;
  acc = 0; lastT = performance.now();   // resume from a clean slate — no banked frame time
}
function playFrameSound(i) {
  const f = frames[i];
  if (!f || !f.sound) return;
  const el = spawnSound(f.sound);
  if (f.hold && playing) {   // per-sound hold; only gates auto-playback, not manual stepping/previews
    soundHold = el;
    acc = 0; lastT = performance.now();     // don't bank frame time while holding
    const release = () => { if (soundHold === el) clearSoundHold(); };
    el.addEventListener('ended', release, { once: true });
    el.addEventListener('error', release, { once: true });
    const p = el.play();                    // no-op if already playing; catches an autoplay rejection so we never hold forever
    if (p && p.catch) p.catch(release);
  }
}
function previewSound(frameId) {
  const f = frames.find(x => x.id === frameId);
  if (!f || !f.sound) return;
  spawnSound(f.sound);
}
function removeSound(frameId) {
  const f = frames.find(x => x.id === frameId);
  if (!f) return;
  delete f.sound;
  delete f.hold;
  persist(); renderFrames();
}
function toggleHold(frameId) {
  const f = frames.find(x => x.id === frameId);
  if (!f || !f.sound) return;
  f.hold = !f.hold;
  if (!f.hold) clearSoundHold();   // release an active hold right away
  persist(); renderFrames();
}
async function startRecording(frameId) {
  if (recording) { stopRecording(); return; }
  if (typeof MediaRecorder === 'undefined') return setStatus('MediaRecorder is not supported in this browser.', true);
  let micStream;
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (err) {
    return setStatus('Microphone unavailable (' + err.name + '). Allow mic access for this site, then try again.', true);
  }
  const mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'].find(m => MediaRecorder.isTypeSupported(m)) || '';
  let rec;
  try { rec = new MediaRecorder(micStream, mime ? { mimeType: mime } : undefined); }
  catch (err) { micStream.getTracks().forEach(t => t.stop()); return setStatus('Could not start the audio recorder.', true); }
  const chunks = [];
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    micStream.getTracks().forEach(t => t.stop());
    const blob = new Blob(chunks, { type: rec.mimeType || 'audio/webm' });
    if (!blob.size) { setStatus('Recording was empty — try again.', true); renderFrames(); return; }
    const reader = new FileReader();
    reader.onloadend = () => {
      const f = frames.find(x => x.id === frameId);
      if (f) { f.sound = reader.result; persist(); renderFrames(); setStatus('Sound attached to the frame.'); }
      else { renderFrames(); setStatus('Frame was removed — recording discarded.', true); }
    };
    reader.readAsDataURL(blob);
  };
  rec.start(250);
  recording = { frameId, rec, auto: setTimeout(stopRecording, 20000) };
  renderFrames();
  setStatus('Recording sound… click ■ Stop on the frame to finish (auto-stops at 20 s).');
}
function stopRecording() {
  if (!recording) return;
  const r = recording;
  recording = null;
  clearTimeout(r.auto);
  try { r.rec.stop(); } catch (err) { /* already stopped */ }
}

/* ---------- save / load project (.zip) ---------- */
const MIME_EXT = { 'image/jpeg': 'jpg', 'image/png': 'png', 'audio/webm': 'webm', 'audio/mp4': 'mp4', 'audio/ogg': 'ogg', 'audio/mpeg': 'mp3', 'audio/wav': 'wav' };

function parseDataUrl(u) {
  if (typeof u !== 'string' || !u.startsWith('data:')) throw new Error('not a data URL');
  const i = u.indexOf('base64,');
  if (i === -1) throw new Error('expected a base64 data URL');
  let mime = u.slice(5, i);
  const semi = mime.lastIndexOf(';');
  if (semi !== -1) mime = mime.slice(0, semi);
  return { mime: mime || 'application/octet-stream', b64: u.slice(i + 7) };
}
function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function bytesToB64(bytes) {
  let bin = '';
  const CH = 0x8000;
  for (let i = 0; i < bytes.length; i += CH) bin += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + CH, bytes.length)));
  return btoa(bin);
}
function extForMime(mime) { return MIME_EXT[String(mime).split(';')[0]] || 'bin'; } // strip codec params, e.g. audio/webm;codecs=opus

/* Build the archive: project.json (structure) + frames/*.jpg + sounds/* */
function buildProjectZip() {
  const entries = [];
  const frameRefs = frames.map((f, i) => {
    const n = String(i + 1).padStart(3, '0');
    const img = parseDataUrl(f.url);
    const imagePath = 'frames/' + n + '.' + extForMime(img.mime);
    entries.push({ name: imagePath, data: b64ToBytes(img.b64) });
    const ref = { id: f.id, image: imagePath, mime: img.mime };
    if (f.sound) {
      const snd = parseDataUrl(f.sound);
      ref.sound = { path: 'sounds/' + n + '.' + extForMime(snd.mime), mime: snd.mime };
      entries.push({ name: ref.sound.path, data: b64ToBytes(snd.b64) });
    }
    if (f.hold) ref.hold = true;
    return ref;
  });
  const project = { format: 'stopmotion-project', version: 1, settings: { fps: settings.fps, ghost: !!settings.ghost, loop: !!settings.loop }, frames: frameRefs };
  entries.push({ name: 'project.json', data: new TextEncoder().encode(JSON.stringify(project, null, 2)) });
  return ZipCodec.writeZip(entries);
}

function downloadBlob(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

function saveProject() {
  try {
    setStatus('Saving project…');
    const bytes = buildProjectZip();
    downloadBlob(new Blob([bytes], { type: 'application/zip' }), 'stopmotion-project.zip');
    setStatus('Saved stopmotion-project.zip (' + formatBytes(bytes.length) + ', ' + frames.length + ' frame(s)).');
  } catch (err) {
    console.error(err);
    setStatus('Could not save project: ' + err.message, true);
  }
}

async function loadProjectFile(file) {
  try {
    const files = ZipCodec.readZip(await file.arrayBuffer());
    if (!files['project.json']) throw new Error('No project.json found — is this a saved Stop Motion Studio project?');
    const project = JSON.parse(new TextDecoder().decode(files['project.json']));
    if (project.format !== 'stopmotion-project' || !Array.isArray(project.frames)) throw new Error('Unrecognized project file.');
    if (typeof project.version === 'number' && project.version > 1) throw new Error('Project version ' + project.version + ' is newer than this app supports.');
    const newFrames = [];
    for (const ref of project.frames) {
      if (!ref || typeof ref.image !== 'string' || !files[ref.image]) throw new Error('Missing image file "' + ((ref && ref.image) || '?') + '" in the archive.');
      let f = { id: uid(), url: 'data:' + (ref.mime || 'image/jpeg') + ';base64,' + bytesToB64(files[ref.image]) };
      if (ref.sound) {
        if (!files[ref.sound.path]) throw new Error('Missing sound file "' + ref.sound.path + '" in the archive.');
        f.sound = 'data:' + (ref.sound.mime || 'audio/webm') + ';base64,' + bytesToB64(files[ref.sound.path]);
      }
      if (ref.hold) f.hold = true;
      newFrames.push(f);
    }
    if (frames.length && !confirm('Replace the current ' + frames.length + ' frame(s) with "' + file.name + '" (' + newFrames.length + ' frame(s))?')) return;
    if (recording) stopRecording();
    playing = false;
    if (rafId) cancelAnimationFrame(rafId);
    stopAllSounds();
    frames = newFrames;
    if (project.settings && typeof project.settings === 'object') {
      settings.fps = Math.min(24, Math.max(1, +project.settings.fps || 8));
      settings.ghost = !!project.settings.ghost;
      settings.loop = project.settings.loop !== false;   // older projects default to looping
    }
    cursorId = frames.length ? frames[0].id : null;
    fpsSlider.value = settings.fps;
    fpsVal.textContent = settings.fps;
    ghostToggle.checked = settings.ghost;
    loopToggle.checked = settings.loop !== false;
    persist(); renderFrames(); updateGhost();
    stage.dataset.mode = 'camera'; setPlayButtons();
    setStatus('Loaded "' + file.name + '": ' + frames.length + ' frame(s) at ' + settings.fps + ' fps.');
  } catch (err) {
    console.error(err);
    setStatus('Could not load project: ' + err.message, true);
  } finally {
    $('#project-file').value = '';
  }
}

$('#save-project-btn').addEventListener('click', saveProject);
$('#load-project-btn').addEventListener('click', () => $('#project-file').click());
$('#project-file').addEventListener('change', () => {
  const file = $('#project-file').files && $('#project-file').files[0];
  if (file) loadProjectFile(file);
});

/* ---------- playback ---------- */
async function ensureLoaded() {
  loadedImgs = await Promise.all(frames.map(f => new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = () => rej(new Error('frame load failed'));
    im.src = f.url;
  })));
}
function drawFrame(i) {
  if (!loadedImgs.length) return;
  const img = loadedImgs[((i % loadedImgs.length) + loadedImgs.length) % loadedImgs.length];
  canvas.width = img.naturalWidth;
  canvas.height = img.naturalHeight;
  canvas.getContext('2d').drawImage(img, 0, 0);
}
function setPlayButtons() {
  playBtn.innerHTML = playing ? '&#9208; Pause' : '&#9654; Play';
  captureBtn.disabled = playing || !video.videoWidth;
}
async function togglePlay() {
  if (playing) { pause(); return; }
  if (!frames.length) { setStatus('No frames to play yet — capture some first.', true); return; }
  playing = true; setPlayButtons();
  try { await ensureLoaded(); } catch (e) { playing = false; setPlayButtons(); setStatus('Could not load frames for playback.', true); return; }
  if (!playing) return;
  playIndex = 0;
  stage.dataset.mode = 'play';
  showGhost(null);            // no ghost during playback
  playFrameSound(0);
  lastT = performance.now(); acc = 0;
  rafId = requestAnimationFrame(tick);
}
function tick(now) {
  if (!playing) return;
  rafId = requestAnimationFrame(tick);
  if (soundHold && !soundHold.ended) return;   // hold this frame until its sound finishes
  acc += now - lastT; lastT = now;
  const stepMs = 1000 / settings.fps;
  const prevIdx = playIndex;
  while (acc >= stepMs) {
    acc -= stepMs;
    if (playIndex < frames.length - 1) playIndex++;
    else if (!settings.loop) { finishAtEnd(); return; }   // play-once: stop after the last frame
    else playIndex = 0;                                    // loop: wrap back to the first
  }
  drawFrame(playIndex);
  if (playIndex !== prevIdx) playFrameSound(playIndex);
}
function finishAtEnd() {
  playing = false;
  if (rafId) cancelAnimationFrame(rafId);
  rafId = null;
  stopAllSounds();
  setPlayButtons();
  setStatus('Reached the end of the reel — press Play to start over.');
}
function pause() {
  backToCamera();
}
async function step(dir) {
  if (!frames.length) return;
  playing = false;
  if (rafId) cancelAnimationFrame(rafId);
  try { await ensureLoaded(); } catch (e) { return; }
  playIndex = ((playIndex + dir) % frames.length + frames.length) % frames.length;
  stage.dataset.mode = 'play';
  showGhost(null);            // no ghost during playback/stepping
  drawFrame(playIndex);
  playFrameSound(playIndex);
}

playBtn.addEventListener('click', togglePlay);
$('#cam-btn').addEventListener('click', backToCamera);
$('#step-back').addEventListener('click', () => step(-1));
$('#step-fwd').addEventListener('click', () => step(1));
})();
</script>
</body>
</html>
